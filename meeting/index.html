<!doctype html>
<!-- 모임 공유 랜딩 페이지. 카톡 카드의 버튼이 ?id=모임id로 연다. Supabase 함수(meeting-share)에서 JSON을 받아 그리고, "앱에서 열기"가 앱 스킴을 열고 앱이 없으면 스토어로 보낸다. ?open=1이면 뜨자마자 한 번 시도 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판교핑 모임</title>
<style>
:root{--pink:#FF2D87;--bg:#FFF5F9;--card:#fff;--text:#191F28;--sub:#6B7684;--line:#F2F4F6}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1C1C20;--text:#F2F4F6;--sub:#9CA3AF;--line:#2A2A30}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
.hero{background:var(--pink);color:#fff;border-radius:20px;padding:24px 20px;margin-bottom:16px}
.hero .eyebrow{margin:0 0 4px;font-size:13px;opacity:.85;letter-spacing:.3px}
.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;opacity:.9}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 10px;font-size:13px;color:var(--pink);letter-spacing:.3px}
.card p{margin:0 0 8px;font-size:15px}.card p:last-child{margin-bottom:0}
.row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.k{min-width:64px;color:var(--sub);font-size:13px;padding-top:2px}.v{flex:1;font-size:15px}
.sub{color:var(--sub);font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;background:var(--pink);color:#fff;text-align:center;text-decoration:none;cursor:pointer}
.store{margin:10px 0 0;text-align:center;font-size:13px;color:var(--sub)}.store a{color:var(--pink);text-decoration:none;font-weight:600}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:20px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="card"><p>모임 안내를 준비하고 있습니다.</p></div>
  <div id="error" class="card hidden"><p>모임을 찾지 못했습니다. 취소됐거나 링크가 잘못되었을 수 있습니다.</p></div>
  <div id="page" class="hidden">
    <div class="hero"><p class="eyebrow" id="eyebrow"></p><h1 id="topic"></h1><p id="hero-sub"></p></div>
    <div class="card">
      <button class="btn" id="open" type="button">앱에서 열기</button>
      <p class="store">참석 여부는 앱에서 알려 주세요. 앱이 없다면 <a id="store" href="#">설치하기</a></p>
    </div>
    <div class="card"><h2>이번 모임</h2>
      <div class="row"><div class="k">모이는 날</div><div class="v" id="when"></div></div>
      <div class="row hidden" id="place-row"><div class="k">장소</div><div class="v"><span id="place"></span><br><span class="sub" id="address"></span></div></div>
      <div class="row hidden" id="talks-row"><div class="k">나눌 이야기</div><div class="v" id="talks"></div></div>
      <div class="row hidden" id="deadline-row"><div class="k">응답 마감</div><div class="v" id="deadline"></div></div>
      <div class="row hidden" id="memo-row"><div class="k">안내</div><div class="v" id="memo"></div></div>
    </div>
    <div class="foot">판교 HR 담당자들의 작은 모임 · 판교핑</div>
  </div>
</div>
<script>
(function () {
  var API = 'https://mniuxrjfivkgtfofzwcf.supabase.co/functions/v1/meeting-share';
  var APP_STORE = 'https://apps.apple.com/kr/app/id6831417547';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.pangyoping.app';
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var $ = function (id) { return document.getElementById(id); };
  function show(id) { $(id).classList.remove('hidden'); }
  function hide(id) { $(id).classList.add('hidden'); }
  function kst(iso) {
    var d = new Date(new Date(iso).getTime() + 9 * 3600000);
    var h = d.getUTCHours(), m = d.getUTCMinutes();
    var time = (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + '시' + (m ? ' ' + m + '분' : '');
    return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 (' + DAYS[d.getUTCDay()] + ') ' + time;
  }
  var android = /Android/i.test(navigator.userAgent);
  var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  $('store').href = android ? PLAY : APP_STORE;
  // 앱 스킴을 연다. Android는 intent 링크(앱이 없으면 Play로), iOS는 스킴을 열고 2초 안에 안 떠나면 App Store로
  function openApp() {
    var path = 'meeting/' + id;
    if (android) {
      location.href = 'intent://' + path + '#Intent;scheme=pangyoping;package=com.pangyoping.app;S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
      return;
    }
    var left = false;
    var onHide = function () { left = true; };
    document.addEventListener('visibilitychange', onHide);
    window.addEventListener('pagehide', onHide);
    location.href = 'pangyoping://' + path;
    setTimeout(function () {
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', onHide);
      if (!left && !document.hidden && ios) location.href = APP_STORE;
    }, 2000);
  }
  $('open').addEventListener('click', openApp);
  function fail() { hide('loading'); show('error'); }
  if (!id) { fail(); return; }
  fetch(API + '?id=' + encodeURIComponent(id), { headers: { Accept: 'application/json' } })
    .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(function (d) {
      var m = d.meeting;
      var month = new Date(new Date(m.starts_at).getTime() + 9 * 3600000).getUTCMonth() + 1;
      document.title = '판교핑 ' + month + '월 모임 · ' + (m.topic || '정기 모임');
      $('eyebrow').textContent = '판교핑 ' + month + '월 모임';
      $('topic').textContent = m.topic || '정기 모임';
      $('hero-sub').textContent = kst(m.starts_at) + (m.place ? ' · ' + m.place : '');
      $('when').textContent = kst(m.starts_at);
      if (m.place) { $('place').textContent = m.place; $('address').textContent = m.address || ''; show('place-row'); }
      if (d.talks && d.talks.length) {
        var box = $('talks'); box.textContent = '';
        d.talks.forEach(function (t) {
          var p = document.createElement('p'); p.textContent = t.topic || '주제 준비 중';
          var who = document.createElement('span'); who.className = 'sub'; who.textContent = ' — ' + (t.presenter || ''); p.appendChild(who); box.appendChild(p);
        });
        show('talks-row');
      }
      if (m.rsvp_deadline) { $('deadline').textContent = kst(m.rsvp_deadline); show('deadline-row'); }
      if (m.memo) { $('memo').textContent = m.memo; show('memo-row'); }
      hide('loading'); show('page');
      if (params.get('open') === '1' && (android || ios)) openApp();
    })
    .catch(fail);
})();
</script>
</body>
</html>
